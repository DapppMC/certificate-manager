<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" />

  <!-- Inner Certificate Sheet with Shadow -->
  <g filter="url(#shadow)">
    <rect x="46" y="44" width="164" height="168" rx="14" fill="#FFFFFF" />
    <!-- Certificate Border Frame -->
    <rect x="54" y="52" width="148" height="152" rx="10" fill="none" stroke="#E0E7FF" stroke-width="2.5" />
    <rect x="58" y="56" width="140" height="144" rx="8" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="4,3" />

    <!-- Document Header / Logo Pill -->
    <rect x="98" y="68" width="60" height="10" rx="5" fill="#4F46E5" />

    <!-- Content Lines -->
    <rect x="74" y="92" width="108" height="6" rx="3" fill="#94A3B8" />
    <rect x="86" y="106" width="84" height="6" rx="3" fill="#CBD5E1" />
    <rect x="78" y="120" width="100" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="90" y="132" width="76" height="5" rx="2.5" fill="#E2E8F0" />

    <!-- Golden Seal & Ribbon -->
    <!-- Ribbon Tails -->
    <path d="M118 164 L114 194 L128 184 L142 194 L138 164 Z" fill="#DC2626" />
    <!-- Seal Medallion -->
    <circle cx="128" cy="162" r="22" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" />
    <circle cx="128" cy="162" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2" />
    <!-- Star in Seal -->
    <path d="M128 152 L131 159 L138 160 L133 165 L134 172 L128 168 L122 172 L123 165 L118 160 L125 159 Z" fill="#FFFFFF" />
  </g>
</svg>
